# Sweeper: hapus release temp nyasar (encode-src-* / transcode-* / tmp-*) yang
# tertinggal karena run dibatalkan/timeout di tengah jalan.
name: Release Sweeper
on:
  schedule:
    - cron: "0 */6 * * *"   # tiap 6 jam
  workflow_dispatch:

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Hapus temp release >6 jam
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          now=$(date -u +%s)
          gh api "repos/${{ github.repository }}/releases" --paginate \
            --jq '.[] | select(.tag_name | test("^(encode-src-|transcode-|tmp-)")) | .tag_name + " " + .published_at' \
          | while read -r tag pub; do
            ts=$(date -u -d "$pub" +%s 2>/dev/null || echo 0)
            age_h=$(( (now - ts) / 3600 ))
            if [ "$age_h" -ge 6 ]; then
              gh release delete "$tag" --repo "${{ github.repository }}" --yes --cleanup-tag \
                && echo "SWEPT: $tag (umur ${age_h}h)"
            else
              echo "SKIP baru: $tag (${age_h}h)"
            fi
          done
