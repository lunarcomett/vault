name: Heartbeat
# Push commit ringan ke branch `heartbeat` tiap 25 hari supaya repo tetap aktif
# dan workflow schedule (daily-snapshot) tidak auto-di-disable GitHub setelah 60 hari.
# Commit dari GITHUB_TOKEN TIDAK dihitung aktivitas -> pakai secret HB_PAT.
on:
  schedule:
    - cron: "30 2 1,26 * *"   # 09:30 WIB tgl 1 & 26
  workflow_dispatch:

jobs:
  beat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Push heartbeat commit
        env:
          GH_TOKEN: ${{ secrets.HB_PAT }}
        run: python3 scripts/heartbeat_commit.py
