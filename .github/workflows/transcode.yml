name: vault-transcode

# <=7200s: one chunk; >7200s: exactly two balanced, keyframe-aware chunks.
# Source release remains recoverable until Telegram delivery is confirmed.
permissions:
  contents: read

on:
  repository_dispatch:
    types: [transcode-request]
  workflow_dispatch:
    inputs:
      filename:
        required: true
      chat_id:
        required: true
      release_tag:
        required: true
      duration:
        required: true
      human_duration:
        required: false
        default: ''
      hevc_preset:
        required: false
        default: 'veryfast'
      hevc_crf:
        required: false
        default: '24'
      job_id:
        required: false
        default: ''

env:
  TZ: Asia/Jakarta

defaults:
  run:
    shell: bash

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    outputs:
      filename: ${{ steps.inputs.outputs.filename }}
      chat_id: ${{ steps.inputs.outputs.chat_id }}
      release_tag: ${{ steps.inputs.outputs.release_tag }}
      duration: ${{ steps.inputs.outputs.duration }}
      human_duration: ${{ steps.inputs.outputs.human_duration }}
      hevc_preset: ${{ steps.inputs.outputs.hevc_preset }}
      hevc_crf: ${{ steps.inputs.outputs.hevc_crf }}
      job_id: ${{ steps.inputs.outputs.job_id }}
      matrix: ${{ steps.split.outputs.matrix }}
      count: ${{ steps.split.outputs.count }}
      source_duration: ${{ steps.split.outputs.source_duration }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate dispatch inputs
        id: inputs
        run: python3 scripts/matrix_media.py inputs
      - name: Protect source from age-only release sweeper
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/matrix_media.py protect-source
      - name: Install ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Download ORIGINAL dari temp release
        id: dl
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.inputs.outputs.release_tag }}
          RAW: ${{ steps.inputs.outputs.filename }}
        run: |
          mkdir -p /tmp/vault_dl
          # Match only validated requested filename or numbered binary parts.
          # Never write arbitrary release asset names to disk.
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" > /tmp/vault_release.json
          python3 - <<'PY'
          import json, os, pathlib, re, subprocess
          root = pathlib.Path('/tmp/vault_dl')
          raw = os.environ['RAW']
          release = json.loads(pathlib.Path('/tmp/vault_release.json').read_text())
          exact = [a for a in release['assets'] if a['name'] == raw]
          parts = sorted((a for a in release['assets']
                          if re.fullmatch(re.escape(raw) + r'\.part-\d{3}', a['name'])),
                         key=lambda a: a['name'])
          if exact and parts:
              raise SystemExit('Ambiguous source: whole file and parts both present')
          assets = exact or parts
          if not assets:
              raise SystemExit('Requested original asset(s) missing')
          if parts and [a['name'] for a in parts] != [f'{raw}.part-{i:03d}' for i in range(len(parts))]:
              raise SystemExit('Source parts missing or out of order')
          output = root / raw
          with output.open('wb') as joined:
              for asset in assets:
                  asset_id = int(asset['id'])
                  part = root / f'asset-{asset_id}.download'
                  with part.open('wb') as target:
                      subprocess.run(['gh', 'api',
                                      f"repos/{os.environ['GITHUB_REPOSITORY']}/releases/assets/{asset_id}",
                                      '-H', 'Accept: application/octet-stream'], stdout=target, check=True)
                  if part.stat().st_size != int(asset['size']):
                      raise SystemExit(f'Incomplete asset {asset_id}')
                  with part.open('rb') as source:
                      import shutil
                      shutil.copyfileobj(source, joined)
                  part.unlink()  # downloaded copy only; assembled source and release retained
          if output.stat().st_size <= 0:
              raise SystemExit('Original empty')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as outputs:
              outputs.write(f'ORIG_FILE={output}\n')
          PY
      - name: Notif encode mulai
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ steps.inputs.outputs.chat_id }}
          ORIG_FILE: ${{ steps.dl.outputs.ORIG_FILE }}
          PRESET: ${{ steps.inputs.outputs.hevc_preset }}
          CRF: ${{ steps.inputs.outputs.hevc_crf }}
          TG_API_URL: 'https://api.telegram.org'
        run: |
          SZ=$(du -h "$ORIG_FILE" | cut -f1)
          python3 scripts/send_message.py "⏳ <b>Encode HEVC dimulai</b> | 📦 $SZ | 🎚 $PRESET CRF $CRF"
      - name: Split source and checksum manifest
        id: split
        env:
          ORIG_FILE: ${{ steps.dl.outputs.ORIG_FILE }}
        run: python3 scripts/matrix_media.py prepare --input "$ORIG_FILE" --output-dir /tmp/matrix-input
      - name: Upload source chunks and manifest
        uses: actions/upload-artifact@v4
        with:
          name: matrix-input
          path: /tmp/matrix-input
          retention-days: 3
          if-no-files-found: error
          compression-level: 0

  encode:
    name: Encode chunk ${{ matrix.index }}
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install ffmpeg (apt + static fallback)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          FFMPEG_STATIC="$(command -v ffmpeg)"
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36"
          for U in \
            "https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz" \
            "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz"; do
            if curl -fsSL --max-time 120 --retry 2 --retry-delay 5 --retry-all-errors -A "$UA" "$U" -o /tmp/ffmpeg.tar.xz \
               && tar -xf /tmp/ffmpeg.tar.xz -C /tmp 2>/dev/null; then
              for BIN in /tmp/ffmpeg-*-amd64-static/ffmpeg /tmp/ffmpeg-master-latest-linux64-gpl/bin/ffmpeg; do
                if [ -x "$BIN" ]; then FFMPEG_STATIC="$BIN"; break 2; fi
              done
            fi
          done
          echo "FFMPEG_STATIC=$FFMPEG_STATIC" >> "$GITHUB_ENV"
          "$FFMPEG_STATIC" -version
      - name: Download source chunks
        uses: actions/download-artifact@v4
        with:
          name: matrix-input
          path: /tmp/matrix-input
      - name: Select chunk and verify checksum
        id: select
        env:
          CHUNK_INDEX: ${{ matrix.index }}
        run: python3 scripts/matrix_media.py select --directory /tmp/matrix-input --index "$CHUNK_INDEX"
      - name: Auto-downgrade preset (sample 60s riil per chunk)
        id: autodg
        env:
          ORIG: ${{ steps.select.outputs.ORIG_FILE }}
          DUR: ${{ steps.select.outputs.duration }}
          PRESET: ${{ needs.prepare.outputs.hevc_preset }}
          CRF_VAL: ${{ needs.prepare.outputs.hevc_crf }}
        run: |
          # select measured this chunk, not dispatch duration or full source duration.
          DUR=$(python3 -c 'import math,os; d=float(os.environ["DUR"]); assert math.isfinite(d) and d>0; print(math.ceil(d))')
          LIMIT_MIN=320
          OVERHEAD_MIN=15
          VFPS=$(ffprobe -v error -select_streams v:0 -show_entries stream=avg_frame_rate -of default=noprint_wrappers=1:nokey=1 "$ORIG" 2>/dev/null | head -1)
          VFPS_NUM=$(awk -F/ '{if(NF==2 && $2!=0) printf "%.2f", $1/$2; else printf "%.2f", $1}' <<<"$VFPS" 2>/dev/null || echo 30)
          if [ -z "$VFPS_NUM" ] || [ "$VFPS_NUM" = "0.00" ]; then VFPS_NUM=30; fi
          echo "FPS video chunk: $VFPS_NUM"
          echo "Sampling 60s encode dgn preset '$PRESET' (CRF $CRF_VAL)..."
          SAMPLE_OUT="/tmp/vault_sample.mkv"
          # Timeout is expected for slow presets; keep partial fps and table fallback.
          timeout 90 "$FFMPEG_STATIC" -hide_banner -y -ss 0 -i "$ORIG" -t 60 \
            -c:v libx265 -profile:v main10 -pix_fmt yuv420p10le \
            -crf "$CRF_VAL" -preset "$PRESET" -tag:v hvc1 \
            -an -progress pipe:1 "$SAMPLE_OUT" 2>/dev/null \
            | awk -F= '/^fps=/{v=$2} END{ if(v!="") print v }' > /tmp/vault_fps.txt || true
          SAMPLE_FPS=$(head -1 /tmp/vault_fps.txt)
          rm -f "$SAMPLE_OUT"
          if [ -n "$SAMPLE_FPS" ] && ! awk "BEGIN{exit !($SAMPLE_FPS<=0)}"; then
            true
          else
            SAMPLE_FPS=""
          fi
          echo "FPS sample (${PRESET}): ${SAMPLE_FPS:-?}"
          declare -A LADDER_IDX=( [ultrafast]=0 [superfast]=1 [veryfast]=2 [faster]=3 [fast]=4 [medium]=5 [slow]=6 [slower]=7 [veryslow]=8 [placebo]=9 )
          declare -A RT=( [ultrafast]=20 [superfast]=12 [veryfast]=6 [faster]=4 [fast]=3 [medium]=1.0 [slow]=0.7 [slower]=0.45 [veryslow]=0.25 [placebo]=0.1 )
          USER_IDX=${LADDER_IDX[$PRESET]:-2}
          USER_RT=${RT[$PRESET]:-6}
          if [ -n "$SAMPLE_FPS" ] && [ "$SAMPLE_FPS" != "0" ]; then
            BASE_RT=$(awk "BEGIN{printf \"%.4f\", $SAMPLE_FPS / $VFPS_NUM}")
          else
            BASE_RT=$USER_RT
            echo "fallback realtime_x=$BASE_RT (tabel)"
          fi
          echo "realtime_x dasar (${PRESET}): ${BASE_RT}x"
          user_est=$(awk "BEGIN{printf \"%d\", ($DUR/60 / $BASE_RT) + $OVERHEAD_MIN}")
          echo "Preset user '$PRESET': est ${user_est}m (limit ${LIMIT_MIN}m)"
          FINAL="$PRESET"
          FINAL_CRF="$CRF_VAL"
          if [ "$user_est" -le "$LIMIT_MIN" ]; then
            echo "Preset user MUAT."
          else
            for p in ultrafast superfast veryfast faster fast medium slow slower veryslow; do
              idx=${LADDER_IDX[$p]}
              if [ "$idx" -gt "$USER_IDX" ]; then continue; fi
              prt=${RT[$p]}
              rtp=$(awk "BEGIN{printf \"%.4f\", $BASE_RT * ($prt / $USER_RT)}")
              est=$(awk "BEGIN{printf \"%d\", ($DUR/60 / $rtp) + $OVERHEAD_MIN}")
              echo "  - $p: ${rtp}x -> est ${est}m"
              if [ "$est" -le "$LIMIT_MIN" ]; then
                FINAL="$p"
                echo "Pilih: $p"
                break
              fi
            done
            if [ "$FINAL" = "$PRESET" ]; then
              FINAL="ultrafast"
              echo "Tidak ada yang muat - fallback ultrafast"
            fi
          fi
          echo "FINAL_PRESET=$FINAL" >> "$GITHUB_OUTPUT"
          echo "FINAL_CRF=$FINAL_CRF" >> "$GITHUB_OUTPUT"
      - name: Disk watchdog (fail this runner only)
        run: |
          USE=$(df /tmp | awk 'NR==2{gsub("%","",$5); print $5}')
          echo "Disk /tmp: ${USE}% terpakai"
          if [ "${USE:-0}" -ge 85 ]; then
            echo "Disk runner >=85%; source release retained."
            exit 1
          fi
      - name: Encode to HEVC 10-bit
        id: hevc
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ needs.prepare.outputs.chat_id }}
          FILENAME: ${{ needs.prepare.outputs.filename }}
          DURATION_SEC: ${{ steps.select.outputs.duration }}
          TG_API_URL: 'https://api.telegram.org'
          ORIG_FILE: ${{ steps.select.outputs.ORIG_FILE }}
          FFMPEG_STATIC: ${{ env.FFMPEG_STATIC }}
          HEVC_PRESET: ${{ steps.autodg.outputs.FINAL_PRESET || 'veryfast' }}
          HEVC_CRF: ${{ steps.autodg.outputs.FINAL_CRF || '24' }}
          CHOSEN_PRESET: ${{ needs.prepare.outputs.hevc_preset || 'veryfast' }}
          ENCODE_PROFILE: live
          REQUESTED_DURATION: ${{ steps.select.outputs.duration }}
        run: bash scripts/run_hevc_encode.sh
      - name: Validate encoded HEVC and pack checksum metadata
        env:
          CHUNK_INDEX: ${{ matrix.index }}
          HEVC_FILE: ${{ env.HEVC_FILE }}
        run: python3 scripts/matrix_media.py pack --directory /tmp/matrix-input --index "$CHUNK_INDEX" --output-dir "/tmp/matrix-output-$CHUNK_INDEX"
      - name: Upload encoded chunk and source manifest
        uses: actions/upload-artifact@v4
        with:
          name: encoded-${{ matrix.index }}
          path: /tmp/matrix-output-${{ matrix.index }}
          retention-days: 3
          if-no-files-found: error
          compression-level: 0

  finalize:
    needs: [prepare, encode]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Download all encoded chunks
        uses: actions/download-artifact@v4
        with:
          pattern: encoded-*
          merge-multiple: true
          path: /tmp/matrix-encoded
      - name: Verify all chunks and concat in source order
        env:
          RAW: ${{ needs.prepare.outputs.filename }}
        run: |
          mkdir -p /tmp/vault_dl
          python3 scripts/matrix_media.py finalize --directory /tmp/matrix-encoded --output "/tmp/vault_dl/${RAW%.*}-h265-10bit.mp4"
      - name: Split HEVC jika lebih dari 2GB
        run: |
          HF="$HEVC_FILE"
          test -s "$HF"
          SPLIT=0
          SIZE=$(stat -c%s "$HF")
          MAX=$((2*1024*1024*1024))
          if [ "$SIZE" -gt "$MAX" ]; then
            echo "HEVC lebih dari 2GB -> split 1990M; preserve assembled HEVC"
            split -b 1990M --numeric-suffixes=0 --suffix-length=3 "$HF" "${HF}.part-"
            SPLIT=1
          fi
          echo "HEVC_SPLIT=$SPLIT" >> "$GITHUB_ENV"
      - name: Start local Bot API Server (2GB)
        env:
          TELEGRAM_API_ID: ${{ secrets.TG_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TG_API_HASH }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: |
          mkdir -p /tmp/tg-bot-api
          docker run -d --name tg-bot-api -p 8081:8081 \
            -e TELEGRAM_API_ID="$TELEGRAM_API_ID" \
            -e TELEGRAM_API_HASH="$TELEGRAM_API_HASH" \
            -e TELEGRAM_LOCAL=1 \
            -v /tmp/tg-bot-api:/var/lib/telegram-bot-api \
            aiogram/telegram-bot-api:latest \
            --local -m 2097152000 --dir /var/lib/telegram-bot-api --http-port 8081 --verbosity=2
          for i in $(seq 1 45); do
            CODE=$(curl -s --max-time 5 -o /dev/null -w "%{http_code}" "http://localhost:8081/bot${BOT_TOKEN}/getMe" || true)
            if [ "$CODE" = "200" ]; then echo "Bot API Server ready"; exit 0; fi
            sleep 2
          done
          echo "Bot API Server not ready; retain source release"
          exit 1
      - name: Notify Telegram — confirmed HEVC delivery
        id: delivery
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ needs.prepare.outputs.chat_id }}
          FILENAME: ${{ needs.prepare.outputs.filename }}
          HUMAN_DUR: ${{ needs.prepare.outputs.human_duration }}
          JOB_ID: ${{ needs.prepare.outputs.job_id }}
          JOB_STATUS: ${{ job.status }}
          HEVC_FILE: ${{ env.HEVC_FILE }}
          HEVC_SIZE: ${{ env.HEVC_SIZE }}
          HEVC_RES: ${{ env.HEVC_RES }}
          HEVC_VCODEC: ${{ env.HEVC_VCODEC }}
          HEVC_VBITRATE: ${{ env.HEVC_VBITRATE }}
          HEVC_DUR: ${{ env.HEVC_DUR }}
          HEVC_THUMB_FILE: ${{ env.HEVC_THUMB_FILE }}
          HAS_HEVC_THUMB: ${{ env.HAS_HEVC_THUMB }}
          HEVC_SPLIT: ${{ env.HEVC_SPLIT }}
          CHAPTERS_TEXT: ${{ env.CHAPTERS_TEXT }}
          FAIL_REASON: ${{ env.FAIL_REASON }}
          REAL_DURATION: ${{ env.ACT_DURATION_SEC }}
          RESOLUTION: ''
          VCODEC: ''
          VBITRATE: ''
          FILE_SIZE: ''
          THUMB_FILE: ''
          HAS_THUMB: '0'
          ORIG_BYTES: '0'
          TAG: ''
          TG_API_URL: 'http://localhost:8081'
          ORV_ID: ${{ needs.prepare.outputs.job_id }}
          PHASE: hevc
          NOTIFY_HEVC_ETA: '0'
        run: python3 scripts/matrix_delivery.py
      - name: Hapus temp release hanya setelah delivery terkonfirmasi
        if: success() && steps.delivery.outputs.delivered == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.release_tag }}
        run: |
          gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
          echo "Temp release dihapus setelah Telegram delivery confirmed."

  failure-notify:
    needs: [prepare, encode, finalize]
    if: >-
      always() && (needs.prepare.result == 'failure' || needs.encode.result == 'failure' || needs.finalize.result == 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Recover validated inputs if prepare failed early
        id: inputs
        run: python3 scripts/matrix_media.py inputs
      - name: Report failure without deleting source
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ needs.prepare.outputs.chat_id || steps.inputs.outputs.chat_id }}
          TG_API_URL: 'https://api.telegram.org'
          PREPARE_RESULT: ${{ needs.prepare.result }}
          ENCODE_RESULT: ${{ needs.encode.result }}
          FINALIZE_RESULT: ${{ needs.finalize.result }}
        run: |
          python3 scripts/send_message.py "❌ Transcode gagal: prepare=$PREPARE_RESULT, encode=$ENCODE_RESULT, finalize=$FINALIZE_RESULT. Temp release dipertahankan bila delivery belum terkonfirmasi."
